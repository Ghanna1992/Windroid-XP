name: Refactor assets once

on:
  push:
    branches:
      - refactor/main-split-assets
    paths:
      - '.github/workflows/refactor-assets-once.yml'

permissions:
  contents: write

jobs:
  extract-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract asset helpers from MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/com/windroid/xp/MainActivity.kt')
          out_path = Path('app/src/main/java/com/windroid/xp/XpAssets.kt')
          text = main_path.read_text()

          start_marker = 'private fun listAssetImages(context: Context, folder: String): List<String> {'
          end_marker = 'private fun iconPrefKey(id: String) = "custom_icon_$id"'
          start = text.index(start_marker)
          end = text.index(end_marker)
          block = text[start:end].rstrip() + '\n'

          block = block.replace('private fun listAssetImages', 'internal fun listAssetImages', 1)
          block = block.replace('private fun loadAssetImage', 'internal fun loadAssetImage', 1)
          block = block.replace('private fun loadStartButtonImage', 'internal fun loadStartButtonImage', 1)

          header = '''package com.windroid.xp\n\nimport android.content.Context\nimport android.graphics.BitmapFactory\nimport androidx.compose.ui.graphics.ImageBitmap\nimport androidx.compose.ui.graphics.asImageBitmap\n\n'''
          out_path.write_text(header + block)
          main_path.write_text(text[:start] + text[end:])
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Dev debug
        run: gradle assembleDevDebug

      - name: Commit only after successful compile
        shell: bash
        run: |
          git config user.name 'Ghanna1992'
          git config user.email 'geradhanna@gmail.com'
          git add app/src/main/java/com/windroid/xp/MainActivity.kt app/src/main/java/com/windroid/xp/XpAssets.kt
          git commit -m 'Extract asset loading from MainActivity'
          git push origin HEAD:refactor/main-split-assets
