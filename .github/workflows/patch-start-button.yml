name: Patch Start button background

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Start button edge cleanup
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('app/src/main/java/com/windroid/xp/MainActivity.kt'); s=p.read_text(); old='return a == 0 || (max - min <= 30 && average >= 135)'; new='return a == 0 || (max - min <= 30 && (average >= 135 || average <= 45))'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/windroid/xp/MainActivity.kt
          git diff --cached --check
          git commit -m "Fix Start button black edge background"
          git push
