name: Build Windroid XP

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - dev

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.2.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: One-shot Windows Update branding patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/main/java/com/windroid/xp/WindowsUpdatePage.kt')
          text = path.read_text()
          header_pattern = r'@Composable private fun SiteHeader\(onDeadEnd: \(String\) -> Unit, onValidation: \(\) -> Unit\) \{.*?(?=@Composable private fun UpdateSidebar)'
          footer_pattern = r'@Composable private fun SiteFooter\(onPrivacy: \(\) -> Unit, onTerms: \(\) -> Unit\) \{.*?(?=@Composable private fun FakeIeStatus)'
          header = '''@Composable private fun SiteHeader(onDeadEnd: (String) -> Unit, onValidation: () -> Unit) {
              Column {
                  Row(
                      Modifier.fillMaxWidth().height(54.dp)
                          .background(Brush.horizontalGradient(listOf(Color.White, Color(0xFFC5D6F3), Color(0xFF7297DB))))
                          .padding(horizontal = 12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      WindroidBrandAsset(wordmark = false, modifier = Modifier.size(36.dp))
                      Spacer(Modifier.width(6.dp))
                      WindroidBrandAsset(wordmark = true, modifier = Modifier.width(170.dp).height(40.dp))
                      Spacer(Modifier.weight(1f))
                      Column(horizontalAlignment = Alignment.End) {
                          Row {
                              WebLink("Windroid.com Home") { onDeadEnd("Windroid.com Home") }
                              Text("  |  ", fontSize = 9.sp)
                              WebLink("Site Map") { onDeadEnd("Site Map") }
                          }
                          Text("Search Windroid.com for:", fontSize = 8.sp)
                      }
                  }
                  Box(
                      Modifier.fillMaxWidth().height(34.dp).background(Color(0xFF4E78C8)).padding(horizontal = 14.dp),
                      contentAlignment = Alignment.CenterStart
                  ) { Text("Windroid XP Update", fontSize = 20.sp, color = Color.White) }
                  Row(
                      Modifier.fillMaxWidth().height(29.dp).background(Color(0xFFF3F3F1)).border(1.dp, Color(0xFFD1D1CF)).padding(horizontal = 10.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      listOf("Windroid Family", "Windroid Marketplace", "Android Family", "Windroid Update").forEachIndexed { i, s ->
                          if (i > 0) Text(" | ", color = Color.Gray)
                          Text(s, fontSize = 9.sp, fontWeight = FontWeight.Bold, color = Color(0xFF444444), modifier = Modifier.clickable { if (s == "Windroid Update") onValidation() else onDeadEnd(s) }.padding(4.dp))
                      }
                  }
              }
          }
'''
          footer = '''@Composable private fun SiteFooter(onPrivacy: () -> Unit, onTerms: () -> Unit) {
              Row(
                  Modifier.fillMaxWidth().height(48.dp)
                      .background(Brush.horizontalGradient(listOf(Color.White, Color(0xFFB6CBF0), Color(0xFF7194D5))))
                      .padding(horizontal = 12.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Column {
                      WebLink("Windroid Update Privacy Statement", onPrivacy)
                      Row {
                          Text("©2005 Windroid Corporation. All rights reserved.  ", fontSize = 8.sp)
                          WebLink("Terms of Use", onTerms)
                      }
                  }
                  Spacer(Modifier.weight(1f))
                  WindroidBrandAsset(wordmark = true, modifier = Modifier.width(108.dp).height(34.dp))
              }
          }
'''
          text, n1 = re.subn(header_pattern, header, text, count=1, flags=re.S)
          text, n2 = re.subn(footer_pattern, footer, text, count=1, flags=re.S)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Guard failed header={n1} footer={n2}')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/windroid/xp/WindowsUpdatePage.kt
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Brand Windows Update chrome"
            git push
          fi

      - name: Choose channel
        id: channel
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${DISPATCH_CHANNEL:-stable}"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qi '\[stable\]'; then
            CHANNEL="stable"
          else
            CHANNEL="dev"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "stable" ]; then
            echo "apk_name=Windroid-XP.apk" >> "$GITHUB_OUTPUT"
          else
            echo "apk_name=Windroid-XP-Dev.apk" >> "$GITHUB_OUTPUT"
          fi
          echo "Building $CHANNEL channel"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detect signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WINDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing keystore
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WINDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/windroid-release.jks"

      - name: Build signed Dev APK
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'dev'
        env:
          WINDROID_KEYSTORE_PATH: ${{ runner.temp }}/windroid-release.jks
          WINDROID_KEYSTORE_PASSWORD: ${{ secrets.WINDROID_KEYSTORE_PASSWORD }}
          WINDROID_KEY_ALIAS: ${{ secrets.WINDROID_KEY_ALIAS }}
          WINDROID_KEY_PASSWORD: ${{ secrets.WINDROID_KEY_PASSWORD }}
        run: gradle assembleDevRelease

      - name: Build signed Stable APK
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'stable'
        env:
          WINDROID_KEYSTORE_PATH: ${{ runner.temp }}/windroid-release.jks
          WINDROID_KEYSTORE_PASSWORD: ${{ secrets.WINDROID_KEYSTORE_PASSWORD }}
          WINDROID_KEY_ALIAS: ${{ secrets.WINDROID_KEY_ALIAS }}
          WINDROID_KEY_PASSWORD: ${{ secrets.WINDROID_KEY_PASSWORD }}
        run: gradle assembleStableRelease

      - name: Prepare Dev APK
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'dev'
        run: cp app/build/outputs/apk/dev/release/app-dev-release.apk Windroid-XP-Dev.apk

      - name: Prepare Stable APK
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'stable'
        run: cp app/build/outputs/apk/stable/release/app-stable-release.apk Windroid-XP.apk

      - name: Upload signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Windroid-XP-${{ steps.channel.outputs.channel }}-${{ env.VERSION_NAME }}
          path: ${{ steps.channel.outputs.apk_name }}

      - name: Publish Dev prerelease
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-v${{ env.VERSION_NAME }}
          name: Windroid XP Dev ${{ env.VERSION_NAME }}
          prerelease: true
          make_latest: false
          body_path: release-notes/current.md
          files: Windroid-XP-Dev.apk

      - name: Publish Stable release
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Windroid XP ${{ env.VERSION_NAME }}
          prerelease: false
          make_latest: true
          body_path: release-notes/current.md
          files: Windroid-XP.apk

      - name: Build fallback Dev debug APK
        if: steps.signing.outputs.configured != 'true' && steps.channel.outputs.channel == 'dev'
        run: gradle assembleDevDebug

      - name: Build fallback Stable debug APK
        if: steps.signing.outputs.configured != 'true' && steps.channel.outputs.channel == 'stable'
        run: gradle assembleStableDebug