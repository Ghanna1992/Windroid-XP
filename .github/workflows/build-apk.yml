name: Build Windroid XP

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - dev

permissions:
  contents: write

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 0.2.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guarded Control Panel swap
        shell: bash
        run: |
          if [ ! -f .control-panel-swap ]; then
            echo "No Control Panel swap requested."
            exit 0
          fi
          python3 scripts/control_panel_swap.py
          rm -f .control-panel-swap scripts/control_panel_swap.py
          git config user.name "Windroid XP Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/windroid/xp/MainActivity.kt release-notes/current.md .control-panel-swap scripts/control_panel_swap.py
          git diff --cached --check
          git commit -m "Use XP category Control Panel"
          git push

      - name: Choose channel
        id: channel
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${DISPATCH_CHANNEL:-stable}"
          elif printf '%s' "$COMMIT_MESSAGE" | grep -qi '\[stable\]'; then
            CHANNEL="stable"
          else
            CHANNEL="dev"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "stable" ]; then
            echo "apk_name=Windroid-XP.apk" >> "$GITHUB_OUTPUT"
          else
            echo "apk_name=Windroid-XP-Dev.apk" >> "$GITHUB_OUTPUT"
          fi
          echo "Building $CHANNEL channel"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detect signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WINDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing keystore
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WINDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/windroid-release.jks"

      - name: Build signed Dev APK
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'dev'
        env:
          WINDROID_KEYSTORE_PATH: ${{ runner.temp }}/windroid-release.jks
          WINDROID_KEYSTORE_PASSWORD: ${{ secrets.WINDROID_KEYSTORE_PASSWORD }}
          WINDROID_KEY_ALIAS: ${{ secrets.WINDROID_KEY_ALIAS }}
          WINDROID_KEY_PASSWORD: ${{ secrets.WINDROID_KEY_PASSWORD }}
        run: gradle assembleDevRelease

      - name: Build signed Stable APK
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'stable'
        env:
          WINDROID_KEYSTORE_PATH: ${{ runner.temp }}/windroid-release.jks
          WINDROID_KEYSTORE_PASSWORD: ${{ secrets.WINDROID_KEYSTORE_PASSWORD }}
          WINDROID_KEY_ALIAS: ${{ secrets.WINDROID_KEY_ALIAS }}
          WINDROID_KEY_PASSWORD: ${{ secrets.WINDROID_KEY_PASSWORD }}
        run: gradle assembleStableRelease

      - name: Prepare Dev APK
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'dev'
        run: cp app/build/outputs/apk/dev/release/app-dev-release.apk Windroid-XP-Dev.apk

      - name: Prepare Stable APK
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'stable'
        run: cp app/build/outputs/apk/stable/release/app-stable-release.apk Windroid-XP.apk

      - name: Upload signed APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Windroid-XP-${{ steps.channel.outputs.channel }}-${{ env.VERSION_NAME }}
          path: ${{ steps.channel.outputs.apk_name }}

      - name: Publish Dev prerelease
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-v${{ env.VERSION_NAME }}
          name: Windroid XP Dev ${{ env.VERSION_NAME }}
          prerelease: true
          make_latest: false
          body_path: release-notes/current.md
          files: Windroid-XP-Dev.apk

      - name: Publish Stable release
        if: steps.signing.outputs.configured == 'true' && steps.channel.outputs.channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Windroid XP ${{ env.VERSION_NAME }}
          prerelease: false
          make_latest: true
          body_path: release-notes/current.md
          files: Windroid-XP.apk

      - name: Build fallback Dev debug APK
        if: steps.signing.outputs.configured != 'true' && steps.channel.outputs.channel == 'dev'
        run: gradle assembleDevDebug

      - name: Build fallback Stable debug APK
        if: steps.signing.outputs.configured != 'true' && steps.channel.outputs.channel == 'stable'
        run: gradle assembleStableDebug
