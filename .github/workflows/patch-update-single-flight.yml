name: Patch Windows Update Single Flight

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-update-single-flight.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Windows Update UI only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/windroid/xp/WindowsUpdatePage.kt')
          text = p.read_text()

          replacements = [
              (
                  'fun WindowsUpdatePage(status: String, progress: Int, availableVersion: String?, notes: String?, downloaded: Boolean, history: List<UpdateManager.UpdateHistoryItem> = emptyList(), historyLoading: Boolean = false, automaticChecks: Boolean = true, onAutomaticChecksChanged: (Boolean) -> Unit = {}, onCheckAgain: () -> Unit, onDownloadAndInstall: () -> Unit, onInstall: () -> Unit, onClose: () -> Unit) {',
                  'fun WindowsUpdatePage(status: String, progress: Int, availableVersion: String?, notes: String?, downloaded: Boolean, history: List<UpdateManager.UpdateHistoryItem> = emptyList(), historyLoading: Boolean = false, automaticChecks: Boolean = true, updateBusy: Boolean = false, onAutomaticChecksChanged: (Boolean) -> Unit = {}, onCheckAgain: () -> Unit, onDownloadAndInstall: () -> Unit, onInstall: () -> Unit, onClose: () -> Unit) {'
              ),
              (
                  '    fun deadEnd(title: String) { deadEndTitle = title; navigate(WindowsUpdateSection.DEAD_END) }',
                  '    fun deadEnd(title: String) { deadEndTitle = title; navigate(WindowsUpdateSection.DEAD_END) }\n    LaunchedEffect(updateBusy) { if (updateBusy && section == WindowsUpdateSection.CUSTOM) navigate(WindowsUpdateSection.HOME) }'
              ),
              (
                  '                                UpdatePageHeading(when { isDownloading -> "Downloading Updates"; downloaded -> "Ready to Install"; hasUpdate -> "Choose how to install updates"; status.contains("checking", true) -> "Checking for the latest updates"; status.contains("up to date", true) -> "Express Results"; else -> "Windows Update" })',
                  '                                UpdatePageHeading(when { updateBusy -> "Installing Updates"; isDownloading -> "Downloading Updates"; downloaded -> "Ready to Install"; hasUpdate -> "Choose how to install updates"; status.contains("checking", true) -> "Checking for the latest updates"; status.contains("up to date", true) -> "Express Results"; else -> "Windows Update" })'
              ),
              (
                  '                                        Row(verticalAlignment = Alignment.CenterVertically) { ClassicWebButton("Express") { if (downloaded) onInstall() else onDownloadAndInstall() }; Spacer(Modifier.width(10.dp)); ClassicWebButton("Custom") { navigate(WindowsUpdateSection.CUSTOM) } }',
                  '                                        if (updateBusy) { Text("An update is already in progress. Installation controls are temporarily disabled.", fontSize = 10.sp, fontWeight = FontWeight.Bold, color = Color(0xFFB00000)) } else { Row(verticalAlignment = Alignment.CenterVertically) { ClassicWebButton("Express") { if (downloaded) onInstall() else onDownloadAndInstall() }; Spacer(Modifier.width(10.dp)); ClassicWebButton("Custom") { navigate(WindowsUpdateSection.CUSTOM) } } }'
              ),
              (
                  '                            WindowsUpdateSection.CUSTOM -> CustomUpdateWizard(versionName = availableVersion ?: BuildConfig.VERSION_NAME, onCancel = { navigate(WindowsUpdateSection.HOME) }, onInstall = { if (downloaded) onInstall() else onDownloadAndInstall() })',
                  '                            WindowsUpdateSection.CUSTOM -> if (updateBusy) UpdateSubPage("Installing updates") { Text("Windows Update is already running. Please wait for the current update to finish.", fontSize = 11.sp, color = Color(0xFFB00000)) } else CustomUpdateWizard(versionName = availableVersion ?: BuildConfig.VERSION_NAME, onCancel = { navigate(WindowsUpdateSection.HOME) }, onInstall = { if (downloaded) onInstall() else onDownloadAndInstall() })'
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Refusing patch: expected exactly 1 occurrence, found {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          p.write_text(text)

          notes = Path('release-notes/current.md')
          note_text = notes.read_text() if notes.exists() else "### What's new\n"
          line = '- Fixed a Windows Update race where repeated install taps could launch competing updater jobs.'
          if line not in note_text:
              note_text = note_text.rstrip() + '\n' + line + '\n'
          notes.write_text(note_text)
          PY

          rm .github/workflows/patch-update-single-flight.yml

          git config user.name "Windroid XP Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/windroid/xp/WindowsUpdatePage.kt release-notes/current.md .github/workflows/patch-update-single-flight.yml
          git diff --cached --check
          git commit -m "Disable duplicate Windows Update triggers"
          git push
