name: Refactor app refresh once

on:
  push:
    branches:
      - refactor/main-split-app-refresh
    paths:
      - '.github/workflows/refactor-app-refresh-once.yml'

permissions:
  contents: write

jobs:
  fix-app-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add package-aware installed app state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          launcher_path = Path('app/src/main/java/com/windroid/xp/LauncherApps.kt')
          main_path = Path('app/src/main/java/com/windroid/xp/MainActivity.kt')
          launcher = launcher_path.read_text()
          main = main_path.read_text()

          launcher = launcher.replace('import android.content.Context\n', 'import android.content.BroadcastReceiver\nimport android.content.Context\n')
          launcher = launcher.replace('import android.content.Intent\n', 'import android.content.Intent\nimport android.content.IntentFilter\n')
          launcher = launcher.replace('import android.net.Uri\n', 'import android.net.Uri\nimport android.os.Build\n')
          launcher = launcher.replace('import androidx.compose.ui.graphics.ImageBitmap\n', 'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.DisposableEffect\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\nimport androidx.compose.ui.graphics.ImageBitmap\n')

          marker = 'internal fun installedApps(context: Context): List<LaunchableApp> {'
          helper = '''@Composable\ninternal fun rememberInstalledApps(context: Context): List<LaunchableApp> {\n    var apps by remember(context) { mutableStateOf(installedApps(context)) }\n\n    DisposableEffect(context) {\n        val receiver = object : BroadcastReceiver() {\n            override fun onReceive(receiverContext: Context?, intent: Intent?) {\n                apps = installedApps(context)\n            }\n        }\n        val filter = IntentFilter().apply {\n            addAction(Intent.ACTION_PACKAGE_ADDED)\n            addAction(Intent.ACTION_PACKAGE_REMOVED)\n            addAction(Intent.ACTION_PACKAGE_REPLACED)\n            addAction(Intent.ACTION_PACKAGE_CHANGED)\n            addDataScheme("package")\n        }\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {\n            context.registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)\n        } else {\n            @Suppress("DEPRECATION")\n            context.registerReceiver(receiver, filter)\n        }\n        onDispose { runCatching { context.unregisterReceiver(receiver) } }\n    }\n\n    return apps\n}\n\n'''
          if helper not in launcher:
              launcher = launcher.replace(marker, helper + marker, 1)

          old = '    val apps = remember { installedApps(context) }'
          new = '    val apps = rememberInstalledApps(context)'
          if old not in main:
              raise SystemExit('Expected installed-app remember line not found')
          main = main.replace(old, new, 1)

          launcher_path.write_text(launcher)
          main_path.write_text(main)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Dev debug
        run: gradle assembleDevDebug

      - name: Commit only after successful compile
        shell: bash
        run: |
          git config user.name 'Ghanna1992'
          git config user.email 'geradhanna@gmail.com'
          git add app/src/main/java/com/windroid/xp/MainActivity.kt app/src/main/java/com/windroid/xp/LauncherApps.kt
          git commit -m 'Refresh installed apps when packages change'
          git push origin HEAD:refactor/main-split-app-refresh
