name: Patch Windows Update UI safely

on:
  push:
    branches:
      - update-ui-safe

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-ui-safe
          fetch-depth: 0

      - name: Replace only Windows Update block
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/windroid/xp/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          start_marker = '        if (updateWindowOpen) {'
          end_marker = '\n\n        taskbarContextApp?.let'

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Windows Update block start not found')

          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Windows Update block end not found')

          replacement = '''        if (updateWindowOpen) {
              WindowsUpdateOverlay(
                  context = context,
                  onClose = { updateWindowOpen = false },
                  modifier = Modifier.align(Alignment.Center)
              )
          }'''

          updated = text[:start] + replacement + text[end:]

          if updated == text:
              raise SystemExit('Patch made no change')

          path.write_text(updated, encoding='utf-8')

      - name: Commit exact patch
        run: |
          git config user.name "Ghanna1992"
          git config user.email "geradhanna@gmail.com"
          git add app/src/main/java/com/windroid/xp/MainActivity.kt
          git diff --cached --check
          git commit -m "[patch-applied] Wire classic Windows Update UI safely"
          git push origin HEAD:update-ui-safe
