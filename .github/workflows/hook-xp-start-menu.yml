name: Hook XP Start Menu

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/hook-xp-start-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only the Start menu call
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/windroid/xp/MainActivity.kt')
          text = main.read_text()
          old = 'StartMenu(apps, launchedApps, context, prefs, customizationVersion, desktopPackages, userName, userAvatar,'
          new = 'XpStartMenu(apps, launchedApps, context, prefs, customizationVersion, desktopPackages, userName, userAvatar,'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Refusing patch: expected exactly 1 StartMenu call, found {count}')
          main.write_text(text.replace(old, new, 1))

          notes = Path('release-notes/current.md')
          note_text = notes.read_text() if notes.exists() else "### What's new\n"
          additions = [
              '- Start menu redesigned for a closer Windows XP layout and feel.',
              '- Expanded Start menu system shortcuts and classic navigation.',
              '- Improved All Programs browsing and recent-program presentation.'
          ]
          for line in additions:
              if line not in note_text:
                  note_text = note_text.rstrip() + '\n' + line + '\n'
          notes.write_text(note_text)
          PY

          rm .github/workflows/hook-xp-start-menu.yml

          git config user.name "Windroid XP Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/windroid/xp/MainActivity.kt release-notes/current.md .github/workflows/hook-xp-start-menu.yml
          git diff --cached --check
          git commit -m "Use faithful XP Start menu"
          git push
