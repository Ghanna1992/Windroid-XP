name: Hook XP Notification Tray

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/hook-notification-tray.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only the tray call
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('app/src/main/java/com/windroid/xp/MainActivity.kt')
          text = main.read_text()
          old = 'XPSystemTray(context)'
          new = 'XpNotificationTray(context)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Refusing patch: expected exactly 1 tray call, found {count}')
          main.write_text(text.replace(old, new, 1))

          notes = Path('release-notes/current.md')
          note_text = notes.read_text() if notes.exists() else "### What's new\n"
          additions = [
              '- Taskbar notification area redesigned with an XP-style expandable tray.',
              '- Active Android notification apps can now appear as taskbar tray icons.',
              '- Added a one-time notification-access setup path for the Windroid tray.'
          ]
          for line in additions:
              if line not in note_text:
                  note_text = note_text.rstrip() + '\n' + line + '\n'
          notes.write_text(note_text)
          PY

          rm .github/workflows/hook-notification-tray.yml

          git config user.name "Windroid XP Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/windroid/xp/MainActivity.kt release-notes/current.md .github/workflows/hook-notification-tray.yml
          git diff --cached --check
          git commit -m "Use XP notification tray"
          git push
