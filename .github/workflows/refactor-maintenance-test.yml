name: Refactor maintenance compile check

on:
  push:
    branches:
      - refactor/main-split-maintenance
    paths:
      - '.github/workflows/refactor-maintenance-test.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDevDebug
