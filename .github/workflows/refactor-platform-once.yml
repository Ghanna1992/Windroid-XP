name: Refactor desktop platform once

on:
  push:
    branches:
      - refactor/main-split-platform
    paths:
      - '.github/workflows/refactor-platform-once.yml'

permissions:
  contents: write

jobs:
  extract-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract desktop platform helpers from MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/com/windroid/xp/MainActivity.kt')
          out_path = Path('app/src/main/java/com/windroid/xp/DesktopPlatform.kt')
          text = main_path.read_text()

          start_marker = 'private const val DEFAULT_DESKTOP_BACKGROUND = "windows_xp_bliss-wide.jpg"'
          end_marker = '@Composable\nfun WindroidDesktop(context: Context) {'
          start = text.index(start_marker)
          end = text.index(end_marker)
          block = text[start:end].rstrip() + '\n'

          block = block.replace('private const val DEFAULT_DESKTOP_BACKGROUND', 'internal const val DEFAULT_DESKTOP_BACKGROUND', 1)
          block = block.replace('private fun iconPrefKey', 'internal fun iconPrefKey', 1)
          block = block.replace('private fun desktopPositionKey', 'internal fun desktopPositionKey', 1)
          block = block.replace('private fun xpIcon', 'internal fun xpIcon', 1)
          block = block.replace('private fun openDefaultBrowser', 'internal fun openDefaultBrowser', 1)
          block = block.replace('private fun openDocuments', 'internal fun openDocuments', 1)

          header = '''package com.windroid.xp\n\nimport android.content.Context\nimport android.content.Intent\nimport android.net.Uri\nimport android.provider.Settings\nimport androidx.compose.ui.graphics.ImageBitmap\n\n'''
          out_path.write_text(header + block)
          main_path.write_text(text[:start] + text[end:])
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Dev debug
        run: gradle assembleDevDebug

      - name: Commit only after successful compile
        shell: bash
        run: |
          git config user.name 'Ghanna1992'
          git config user.email 'geradhanna@gmail.com'
          git add app/src/main/java/com/windroid/xp/MainActivity.kt app/src/main/java/com/windroid/xp/DesktopPlatform.kt
          git commit -m 'Extract desktop platform helpers from MainActivity'
          git push origin HEAD:refactor/main-split-platform
