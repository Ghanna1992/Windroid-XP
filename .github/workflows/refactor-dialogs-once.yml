name: Refactor desktop dialogs once

on:
  push:
    branches:
      - refactor/main-split-dialogs
    paths:
      - '.github/workflows/refactor-dialogs-once.yml'

permissions:
  contents: write

jobs:
  extract-dialogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract desktop dialogs and appearance helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/com/windroid/xp/MainActivity.kt')
          dialogs_path = Path('app/src/main/java/com/windroid/xp/XpDesktopDialogs.kt')
          appearance_path = Path('app/src/main/java/com/windroid/xp/XpAppearance.kt')
          text = main_path.read_text()

          dialogs_start_marker = '@Composable private fun RunWindow'
          category_marker = 'internal fun iconCategory'
          dialogs_start = text.index(dialogs_start_marker)
          category_start = text.index(category_marker, dialogs_start)

          dialogs = text[dialogs_start:category_start].rstrip() + '\n'
          dialogs = dialogs.replace('@Composable private fun RunWindow', '@Composable internal fun RunWindow', 1)
          dialogs = dialogs.replace('@Composable private fun ProfileWindow', '@Composable internal fun ProfileWindow', 1)
          dialogs = dialogs.replace('@Composable private fun FamilySetupWizard', '@Composable internal fun FamilySetupWizard', 1)

          category = text[category_start:].strip()
          if not category.startswith(category_marker):
              raise SystemExit('Unexpected content after dialog block')

          header = '''package com.windroid.xp\n\nimport android.content.Context\nimport android.content.Intent\nimport android.provider.Settings\nimport androidx.compose.foundation.Image\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.border\nimport androidx.compose.foundation.clickable\nimport androidx.compose.foundation.horizontalScroll\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.foundation.text.BasicTextField\nimport androidx.compose.material3.Text\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.style.TextOverflow\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n\n'''
          dialogs_path.write_text(header + dialogs)

          appearance = appearance_path.read_text().rstrip()
          if category_marker not in appearance:
              appearance += '\n\n' + category + '\n'
          appearance_path.write_text(appearance)

          main_path.write_text(text[:dialogs_start].rstrip() + '\n')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Dev debug
        run: gradle assembleDevDebug

      - name: Commit only after successful compile
        shell: bash
        run: |
          git config user.name 'Ghanna1992'
          git config user.email 'geradhanna@gmail.com'
          git add app/src/main/java/com/windroid/xp/MainActivity.kt app/src/main/java/com/windroid/xp/XpDesktopDialogs.kt app/src/main/java/com/windroid/xp/XpAppearance.kt
          git commit -m 'Extract desktop dialogs from MainActivity'
          git push origin HEAD:refactor/main-split-dialogs
