name: Refactor appearance once

on:
  push:
    branches:
      - refactor/main-split-appearance
    paths:
      - '.github/workflows/refactor-appearance-once.yml'

permissions:
  contents: write

jobs:
  extract-appearance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract appearance customization UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/com/windroid/xp/MainActivity.kt')
          out_path = Path('app/src/main/java/com/windroid/xp/XpAppearance.kt')
          text = main_path.read_text()

          start_marker = '@Composable private fun AppearanceWindow('
          end_marker = '@Composable private fun XPActionButton('
          start = text.index(start_marker)
          end = text.index(end_marker)
          block = text[start:end].rstrip() + '\n'

          block = block.replace('@Composable private fun AppearanceWindow', '@Composable internal fun AppearanceWindow', 1)

          header = '''package com.windroid.xp\n\nimport android.content.Context\nimport androidx.compose.foundation.Image\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.border\nimport androidx.compose.foundation.clickable\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.text.BasicTextField\nimport androidx.compose.foundation.verticalScroll\nimport androidx.compose.material3.Text\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.ImageBitmap\nimport androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.style.TextOverflow\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n\n'''
          out_path.write_text(header + block)
          updated = text[:start] + text[end:]
          updated = updated.replace('@Composable private fun XPActionButton(', '@Composable internal fun XPActionButton(', 1)
          updated = updated.replace('@Composable private fun XPWindow(', '@Composable internal fun XPWindow(', 1)
          updated = updated.replace('private fun iconCategory(', 'internal fun iconCategory(', 1)
          main_path.write_text(updated)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Dev debug
        run: gradle assembleDevDebug

      - name: Commit only after successful compile
        shell: bash
        run: |
          git config user.name 'Ghanna1992'
          git config user.email 'geradhanna@gmail.com'
          git add app/src/main/java/com/windroid/xp/MainActivity.kt app/src/main/java/com/windroid/xp/XpAppearance.kt
          git commit -m 'Extract appearance customization from MainActivity'
          git push origin HEAD:refactor/main-split-appearance
