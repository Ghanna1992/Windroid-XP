name: Refactor desktop icons once

on:
  push:
    branches:
      - refactor/desktop-icons
    paths:
      - '.github/workflows/refactor-desktop-icons-once.yml'
      - 'tools/extract_desktop_icons.py'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply extraction
        run: python3 tools/extract_desktop_icons.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Dev debug
        run: gradle assembleDevDebug
      - name: Commit compiled extraction
        run: |
          git config user.name 'Ghanna1992'
          git config user.email 'geradhanna@gmail.com'
          git add app/src/main/java/com/windroid/xp/MainActivity.kt app/src/main/java/com/windroid/xp/XpDesktopIcons.kt
          git commit -m 'Extract desktop icon components from MainActivity'
          git push origin HEAD:refactor/desktop-icons
