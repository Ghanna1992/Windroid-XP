plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.windroid.xp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.windroid.xp'
        minSdk 26
        targetSdk 35
        versionCode = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName = System.getenv('VERSION_NAME') ?: '0.2.0'
    }

    flavorDimensions += 'channel'
    productFlavors {
        stable {
            dimension 'channel'
            manifestPlaceholders = [appLabel: 'Windroid XP']
            buildConfigField 'String', 'UPDATE_CHANNEL', '"stable"'
        }
        dev {
            dimension 'channel'
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            manifestPlaceholders = [appLabel: 'Windroid XP Dev']
            buildConfigField 'String', 'UPDATE_CHANNEL', '"dev"'
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('WINDROID_KEYSTORE_PATH')
            if (keystorePath != null && !keystorePath.trim().isEmpty()) {
                def signingPassword = System.getenv('WINDROID_KEYSTORE_PASSWORD')
                def keyPasswordValue = System.getenv('WINDROID_KEY_PASSWORD') ?: signingPassword
                storeFile = file(keystorePath)
                storePassword = signingPassword
                keyAlias = System.getenv('WINDROID_KEY_ALIAS')
                keyPassword = keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.core:core-ktx:1.15.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
